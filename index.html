<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shristi Student Council — Shristi Academy (2026-2027)." />
    <meta property="og:title" content="Shristi Student Council | Shristi Academy" />
    <meta property="og:description" content="Shristi Student Council — Shristi Academy (2026-2027)." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shristi Student Council" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Student Council | Shristi Academy Board</title>
    <script>
      (function() {
        try {
          var keys = [
            "shristi_hub_canonical_branding_v1",
            "shristi-council-branding-v6",
            "shristi_hub_canonical_state_v1",
            "shristi-council-school-roster-v5"
          ];
          var raw = null;
          for (var i = 0; i < keys.length; i++) {
            raw = localStorage.getItem(keys[i]);
            if (raw) break;
          }
          if (raw) {
            var d = JSON.parse(raw);
            var b = d.branding || (d.state && d.state.branding) || (d.schoolName ? d : null);
            if (b && b.schoolName) {
              document.title = b.schoolName + " | " + (b.boardName || "Student Council");
            }
            var logo = (b && b.logoUrl) || localStorage.getItem("shristi_branding_logo_v1");
            if (logo && String(logo).trim()) {
              var link = document.createElement("link");
              link.rel = "icon";
              link.href = String(logo).trim();
              document.head.appendChild(link);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
